<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Photography — Sébastien Hamdy</title>
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      /* Default background behind each image (shows while loading, or through transparent images).
         Change it here for all photos, or override per photo with style="--bg: #hex". */
      --tile-bg: #f1f1f1;

      /* Inner padding around each image inside its tile. Set to 0 for edge-to-edge. */
      --tile-padding: 0px;

      /* Space between tiles. */
      --gap: 24px;
    }

    html {
      font-family: "Avenir", sans-serif;
      font-size: 16px;
      line-height: 1.6;
      color: #111;
      background: #fff;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    /* Header */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 32px 40px;
      font-size: 0.9rem;
    }

    header .name {
      letter-spacing: 0.15rem;
    }

    nav ul {
      display: flex;
      gap: 32px;
      list-style: none;
    }

    nav a,
    header .name {
      transition: opacity 0.2s ease;
    }

    nav a:hover,
    header .name:hover {
      opacity: 0.5;
    }

    nav a[aria-current="page"] {
      text-decoration: underline;
      text-underline-offset: 6px;
      text-decoration-thickness: 1px;
    }

    /* Gallery */
    main {
      flex: 1;
      animation: fade-in 0.6s ease-out both;
      padding: 24px 40px 80px;
    }

    /* Masonry layout: three columns suit vertical images best.
       Columns fill top to bottom, and every photo keeps its own aspect ratio,
       so portrait and landscape shots can be mixed freely. */
    .gallery {
      column-count: 5;
      column-gap: var(--gap);
    }

    .tile {
      break-inside: avoid;
      margin-bottom: var(--gap);
      padding: var(--tile-padding);
      background: var(--bg, var(--tile-bg));
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 5px;
    }

    .tile img {
      display: block;
      max-width: 100%;
      height: auto;
      border-radius: 5px;
    }

    @keyframes fade-in {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @media (prefers-reduced-motion: reduce) {
      main { animation: none; }
    }

    /* Footer */
    footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 32px 40px;
      font-size: 0.8rem;
      color: #777;
    }

    footer a {
      transition: opacity 0.2s ease;
    }

    footer a:hover {
      opacity: 0.5;
    }

    @media (max-width: 1000px) {
      .gallery {
        column-count: 2;
      }
    }

    @media (max-width: 600px) {
      :root {
        --gap: 16px;
      }

      header,
      footer {
        padding: 24px;
      }

      header {
        flex-direction: column;
        align-items: flex-start;
        gap: 12px;
      }

      nav ul {
        gap: 20px;
      }

      main {
        padding: 8px 24px 64px;
      }

      .gallery {
        column-count: 1;
      }

      footer {
        flex-direction: column;
        gap: 8px;
        text-align: center;
      }
    }
  </style>
</head>
<body>

  <header>
    <a href="index.html" class="name">SÉBASTIEN HAMDY</a>
    <nav>
      <ul>
