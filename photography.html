  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      /* Default background behind each image (shows while loading, or through transparent images).
         Change it here for all photos, or override per photo with style="--bg: #hex". */
      --tile-bg: #f1f1f1;

      /* Inner padding around each image inside its tile. Set to 0 for edge-to-edge. */
      --tile-padding: 0px;

      /* Space between tiles. */
      --gap: 24px;
    }

    html {
      font-family: "Avenir", sans-serif;
      font-size: 16px;
      line-height: 1.6;
      color: #111;
      background: #fff;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    /* Header */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 32px 40px;
      font-size: 0.9rem;
    }

    header .name {
      letter-spacing: 0.15rem;
    }

    nav ul {
      display: flex;
      gap: 32px;
      list-style: none;
    }

    nav a,
    header .name {
      transition: opacity 0.2s ease;
    }

    nav a:hover,
    header .name:hover {
      opacity: 0.5;
    }

    nav a[aria-current="page"] {
      text-decoration: underline;
      text-underline-offset: 6px;
      text-decoration-thickness: 1px;
    }

    /* Menu toggle + close buttons (only shown on mobile) */
    .menu-toggle,
    .menu-close {
      display: none;
      background: none;
      border: 0;
      padding: 8px;
      margin: -8px;
      color: inherit;
      cursor: pointer;
      line-height: 0;
      transition: opacity 0.2s ease;
    }

    .menu-toggle:hover,
    .menu-close:hover {
      opacity: 0.5;
    }

    .menu-toggle:focus-visible,
    .menu-close:focus-visible,
    nav a:focus-visible,
    .name:focus-visible {
      outline: 2px solid #111;
      outline-offset: 4px;
    }

    .menu-toggle svg,
    .menu-close svg {
      width: 26px;
      height: 26px;
      stroke: currentColor;
      stroke-width: 1.5;
      stroke-linecap: round;
      fill: none;
    }

    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
    }

    /* Gallery */
    main {
      flex: 1;
      animation: fade-in 0.6s ease-out both;
      padding: 24px 40px 80px;
    }

    /* Masonry layout: three columns suit vertical images best.
       Columns fill top to bottom, and every photo keeps its own aspect ratio,
       so portrait and landscape shots can be mixed freely. */
    .gallery {
      column-count: 5;
      column-gap: var(--gap);
    }

    .tile {
      break-inside: avoid;
      margin-bottom: var(--gap);
      padding: var(--tile-padding);
      background: var(--bg, var(--tile-bg));
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 5px;
    }

    .tile img {
      display: block;
      max-width: 100%;
      height: auto;
      border-radius: 5px;
    }

    @keyframes fade-in {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @media (prefers-reduced-motion: reduce) {
      main { animation: none; }
    }

    /* Footer */
    footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 32px 40px;
      font-size: 0.8rem;
      color: #777;
    }

    footer a {
      transition: opacity 0.2s ease;
    }

    footer a:hover {
      opacity: 0.5;
    }

    @media (max-width: 1000px) {
      .gallery {
        column-count: 2;
      }
    }

    @media (max-width: 600px) {
      :root {
        --gap: 16px;
      }

      header,
      footer {
        padding: 24px;
      }

      header {
        align-items: center;
      }

      .menu-toggle {
        display: block;
      }

      /* Full-screen white overlay menu */
      nav {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #fff;
        opacity: 0;
        visibility: hidden;
        transition: opacity 0.25s ease, visibility 0s linear 0.25s;
      }

      nav.is-open {
        opacity: 1;
        visibility: visible;
        transition: opacity 0.25s ease, visibility 0s;
      }

      .menu-close {
        display: block;
        position: absolute;
        top: 32px;
        right: 32px;
      }

      nav ul {
        flex-direction: column;
        align-items: center;
        gap: 32px;
        font-size: 1.5rem;
      }

      body.menu-open {
        overflow: hidden;
      }

      main {
        padding: 8px 24px 64px;
      }

      .gallery {
        column-count: 1;
      }
    }
  </style>
</head>
<body>

      <ul>

  <script>
    (function () {
      var toggle = document.querySelector('.menu-toggle');
      var close = document.querySelector('.menu-close');
      var nav = document.getElementById('site-nav');
      if (!toggle || !close || !nav) return;

      function setOpen(open) {
        nav.classList.toggle('is-open', open);
        document.body.classList.toggle('menu-open', open);
        toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
        (open ? close : toggle).focus();
      }

      toggle.addEventListener('click', function () { setOpen(true); });
      close.addEventListener('click', function () { setOpen(false); });
      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape' && nav.classList.contains('is-open')) setOpen(false);
      });
      // Close the overlay when a link is tapped (e.g. same-page link) or the viewport grows past mobile
      nav.addEventListener('click', function (e) {
        if (e.target.closest('a')) setOpen(false);
      });
      window.matchMedia('(min-width: 601px)').addEventListener('change', function (e) {
        if (e.matches && nav.classList.contains('is-open')) setOpen(false);
      });
    })();
  </script>
